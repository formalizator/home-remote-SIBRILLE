      - remote_transmitter.transmit_nec:
          address: 0x22DD
          command: 0x16

  - platform: template
    name: "Sibrille Preset Relax"
    icon: "mdi:coffee"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0x22DD
          command: 0x12

  - platform: template
    name: "Sibrille Preset Warm Medium"
    icon: "mdi:book-open-page-variant"
