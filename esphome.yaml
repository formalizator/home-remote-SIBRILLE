remote_transmitter:
  pin: GPIO4 # Замените на пин вашего ИК-диода
  carrier_duty_percent: 33%

button:
  - platform: template
    name: "Sibrille Lamp Power"
    icon: "mdi:power"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0x22DD
          command: 0x11

  - platform: template
    name: "Sibrille Sleep Timer 15m"
    icon: "mdi:timer-outline"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0x22DD
          command: 0x1D

  - platform: template
    name: "Sibrille Brightness 100% CCT Mid"
    icon: "mdi:brightness-7"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0x22DD
          command: 0x03

  - platform: template
    name: "Sibrille Brightness Up"
    icon: "mdi:brightness-up"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0x22DD
          command: 0x18

  - platform: template
    name: "Sibrille Brightness Down"
    icon: "mdi:brightness-down"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0x22DD
          command: 0x1F

  - platform: template
    name: "Sibrille CCT Cooler"
    icon: "mdi:snowflake"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0x22DD
          command: 0x07

  - platform: template
    name: "Sibrille CCT Warmer"
    icon: "mdi:fire"
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0x22DD
          command: 0x0F

  - platform: template
    name: "Sibrille Preset Daylight"
    icon: "mdi:white-balance-sunny"
